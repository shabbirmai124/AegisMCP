[server]
db_path = "audit.db"
cache_dir = ".cache/cwasm"
guest_wasm_path = "target/wasm32-wasip1/release/aegis-guest-js.wasm"
epoch_tick_ms = 10
max_output_bytes = 1_048_576

[tiers.pure_compute]
max_memory_mb = 16
max_fuel = 20_000_000
max_epoch_ticks = 200
max_table_elements = 10_000
allow_fs = false
allow_net = false

[tiers.scoped_scratchpad]
max_memory_mb = 32
max_fuel = 40_000_000
max_epoch_ticks = 500
max_table_elements = 10_000
max_scratch_bytes = 4_194_304
allow_net = false

[tiers.readonly_data]
max_memory_mb = 32
max_fuel = 50_000_000
max_epoch_ticks = 500
max_table_elements = 10_000
readonly_roots = []
allow_net = false

[tiers.allowlisted_net]
max_memory_mb = 32
max_fuel = 50_000_000
max_epoch_ticks = 800
max_table_elements = 10_000
allowed_domains = ["api.github.com"]
allow_http_plaintext = false
max_response_bytes = 1_048_576
request_timeout_ms = 3000

[plugins]
