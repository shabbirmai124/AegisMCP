[engine]
guest_js_wasm = "target/wasm32-wasip1/release/aegis-guest-js.wasm"
cache_dir = ".cache/cwasm"
audit_db = "audit.db"
epoch_tick_ms = 10
fuel_yield_interval = 100_000
max_output_bytes = 1_048_576

[tiers.pure_compute]
max_memory_bytes = 16_777_216
max_table_elements = 10_000
max_fuel = 20_000_000
max_epoch_ticks = 200

[tiers.scoped_scratchpad]
max_memory_bytes = 33_554_432
max_table_elements = 10_000
max_fuel = 40_000_000
max_epoch_ticks = 500
scratchpad_quota_bytes = 4_194_304

[tiers.readonly_data]
max_memory_bytes = 33_554_432
max_table_elements = 10_000
max_fuel = 50_000_000
max_epoch_ticks = 500
readonly_roots = ["./data"]

[tiers.allowlisted_net]
max_memory_bytes = 33_554_432
max_table_elements = 10_000
max_fuel = 50_000_000
max_epoch_ticks = 800
https_only = true
max_response_bytes = 1_048_576
allowed_domains = ["api.github.com", "registry.npmjs.org", "crates.io"]
